[server]
http_port = 3000

[security]
admin_user = admin
admin_password = grimoire

[paths]
data = /home/%(user)s/data/telemetry/grafana
provisioning = /home/%(user)s/.grimoire/deploy/telemetry/provisioning
logs = /home/%(user)s/data/logs/grimoire/grafana
plugins = /home/%(user)s/data/telemetry/grafana/plugins

[auth.anonymous]
enabled = false

[log]
mode = file
level = info
